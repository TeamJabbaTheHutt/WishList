<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title th:text="'Wishlist: ' + ${wishlist.wishListName}">Wishlist</title>
    <link rel="stylesheet" th:href="@{/login-style.css}">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<div class="wishlist-container">
    <div class="headers-wrapper">

        <h1 class="wishlistNameInSpecificWishlist" th:text="'Wishlist: ' + ${wishlist.wishListName}">Wishlist Name</h1>

        <h3 th:if="${wishlist.getWishes().isEmpty()}">There are no wishes yet, add some new</h3>

    </div>


    <ul class="items-wrapper">

        <li th:each="item : ${wishlist.getWishes()}" class="item">
            <span class="wishesHeaders" th:text="${item.wish_name}">Item Name</span><br>
            <span class="wishesHeaders" th:text="${item.wish_price}">Price</span> kr <br>

            <a class="wishesHeadersLink"
               th:href="${item.wish_link.startsWith('http') ? item.wish_link : 'https://' + item.wish_link}"
               target="_blank"
               th:text="${item.wish_link}">Link</a>


            <div class="item-buttons">
                <a th:href="@{'/wishlist/' + ${wishlist.wishListId} + '/item/' + ${item.getWish_id()} + '/delete'}">
                    <button><i class='bx bx-trash'></i></button>
                </a>
                <a th:href="@{/wishlist/{wishlistId}/item/{itemId}/edit(wishlistId=${wishlist.wishListId}, itemId=${item.wish_id})}">
                    <button ><i class='bxr  bx-edit-alt'></i> </button>
                </a>
            </div>
        </li>

        <!-- Always include the "Add New" -->
        <li class="item add-new">
            <a th:href="@{'/wishlist/' + ${wishlist.wishListId} + '/add'}" class="full-link">+</a>
        </li>
    </ul>
    <div class="headers-wrapper">
        <h1 >Sustainable initiatives</h1>
    </div>
    <div class="grid-container">
        <div class="grid-item">
            <a href="https://oceanfdn.org/" target="_blank">
                <img th:src="@{https://oceanfdn.org/wp-content/themes/oceanfdn/images/logo.png}" alt="Theocean Foundation">
            </a>
        </div>
        <div class="grid-item">
            <a href="https://www.greenpeace.org/international/act/respect-amazon/" target="_blank">
                <img th:src="@{https://upload.wikimedia.org/wikipedia/commons/6/69/Greenpeace_logo.svg}" alt="Greenpeace">
            </a>
        </div>
        <div class="grid-item">
            <a href="https://www.ouronlyhome.eu/en/" target="_blank">
                <img th:src="@{https://www.ouronlyhome.eu/wp-content/uploads/2022/02/OOH_Logo_half_gradient_small-1.png}" alt="Our Home">
            </a>
        </div>
    </div>



</div>

</body>
</html>
