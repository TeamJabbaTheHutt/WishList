<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlists</title>
    <link rel="stylesheet" th:href="@{/login-style.css}">
  <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body class="dashboard">
<div class="dashboard-container">
  <h1>My Wishlists</h1>

  <div class="dashboard-actions">
    <button class="create-btn" onclick="openModal()">
      <i class='bx bx-plus'></i> Create
    </button>
  </div>

  <div th:if="${wishlists.isEmpty()}" class="empty-state">
    <p>You don’t have any wishlists yet.</p>
  </div>

  <ul th:if="${!#lists.isEmpty(wishlists)}">
    <li th:each="item : ${wishlists}" class="wishlist-item">
      <div class="wishlist-header">
        <a th:href="@{'/wishlist/' + ${item.wishListId}}"><h3 th:text="${item.wishListName}">Wishlist Name</h3></a>
        <a th:href="@{'/dashboard/' + ${item.wishListId} + '/delete'}">
          <button type="submit" class="delete-btn">
            <i class='bx bx-trash'></i>
          </button>
        </a>
      </div>
    </li>
  </ul>
</div>

<!-- MODAL -->
<div id="createWishlistModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h2>Create a New Wishlist</h2>
    <form th:action="@{/dashboard/create}" method="post">
      <input type="text" name="wishlistName" placeholder="Enter wishlist name" required>
      <button type="submit" class="create-btn">
        <i class='bx bx-check'></i> Create
      </button>
    </form>
  </div>
</div>

<script>
  const modal = document.getElementById("createWishlistModal");

  function openModal() {
    modal.style.display = "flex";
  }

  function closeModal() {
    modal.style.display = "none";
  }

  window.onclick = function(event) {
    if (event.target === modal) {
      modal.style.display = "none";
    }
  }
</script>

</body>
</html>
